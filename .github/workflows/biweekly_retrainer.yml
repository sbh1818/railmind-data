name: Biweekly Model Retrainer

on:
  schedule:
    - cron: '30 10 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check if 2nd or 4th Sunday
        id: check_week
        run: |
          DAY=$(date +%d)
          DAY=$((10#$DAY))
          if { [ "$DAY" -ge 8 ] && [ "$DAY" -le 14 ]; } || { [ "$DAY" -ge 22 ] && [ "$DAY" -le 28 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping - not 2nd or 4th Sunday (day=$DAY)"
          fi
      - name: Checkout repo
        if: steps.check_week.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        if: steps.check_week.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.check_week.outputs.run == 'true'
        run: pip install pandas numpy catboost scikit-learn requests
      - name: Run model retrainer
        if: steps.check_week.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/retrain_model.py
      - name: Push frontend JSON to frontend repo
        if: steps.check_week.outputs.run == 'true'
        env:
          FRONTEND_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          set -e
          if [ ! -f data/trains_frontend.json ]; then
            echo "No trains_frontend.json produced; skipping push"
            exit 0
          fi
          API="https://api.github.com/repos/sbh1818/railmind-frontend/contents/src/data/trains.json"
          CONTENT=$(base64 -w 0 data/trains_frontend.json)
          SHA=$(curl -s -H "Authorization: token $FRONTEND_TOKEN" "$API" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          BODY=$(python3 -c "import json,sys; print(json.dumps({'message':'data: refresh trains.json from retrainer','content':sys.argv[1],'sha':sys.argv[2]} if sys.argv[2] else {'message':'data: refresh trains.json from retrainer','content':sys.argv[1]}))" "$CONTENT" "$SHA")
          curl -s -X PUT -H "Authorization: token $FRONTEND_TOKEN" -d "$BODY" "$API" > /dev/null
          echo "Frontend JSON pushed"
      - name: Commit updated model
        if: steps.check_week.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "model: retrained"
            git push
          fi
      - name: Notify failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -d "Model Retrainer FAILED! Check logs: github.com/sbh1818/railmind-data/actions" "https://ntfy.sh/$NTFY_TOPIC"
          fi
