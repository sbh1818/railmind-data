name: Biweekly Model Retrainer

on:
  schedule:
    - cron: '30 10 8-14,22-28 * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy catboost scikit-learn requests
      - name: Run model retrainer
        run: python scripts/retrain_model.py
      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "model: retrained"
            git push
          fi