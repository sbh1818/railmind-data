name: CNF/WL Collector

on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC = 2:00 PM IST, daily (gated below)
  workflow_dispatch:        # manual trigger anytime

permissions:
  contents: write

jobs:
  # Gate: run only every 3rd day from the fixed start date (2026-09-08).
  check_day:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Every-3rd-day gate
        id: gate
        run: |
          START=$(date -u -d '2026-09-08' +%s)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - START) / 86400 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$DAYS" -ge 0 ] && [ $((DAYS % 3)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a run day (days since start = $DAYS)"
          fi

  # Stage 1: collect availability in 3 parallel batches
  collect:
    needs: check_day
    if: needs.check_day.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Collect CNF/WL (batch ${{ matrix.batch }}/3)
        run: python scripts/collect_cnf_wl.py --batch ${{ matrix.batch }} --total 3
      - name: Commit batch CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_collected/cnf_wl/
          if git diff --staged --quiet; then
            echo "No new data"
          else
            git commit -m "data: cnf/wl batch ${{ matrix.batch }}"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin master && git push origin master && break
              sleep $((RANDOM % 10 + 3))
            done
          fi

  # Stage 2: merge batch CSVs into one daily file + notify
  aggregate:
    needs: collect
    if: needs.check_day.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Merge batches + notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/collect_cnf_wl.py --aggregate --total 3
      - name: Commit merged CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin master || true
          git add data/daily_collected/cnf_wl/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: cnf/wl merged daily file"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin master && git push origin master && break
              sleep $((RANDOM % 10 + 3))
            done
          fi

  # Failure alert
  notify_failure:
    needs: [collect, aggregate]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -d "CNF/WL Collector FAILED! Check: github.com/sbh1818/railmind-data/actions" "https://ntfy.sh/$NTFY_TOPIC"
          fi
